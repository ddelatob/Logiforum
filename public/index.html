<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>logiforum</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="images/favicon.png" />
  </head>

  <body>
    <header class="top-row">
      <h1 class="digi-tools-header">logiforum</h1>
      <div class="search-bar">
        <img
          src="images/and_gate_vector.svg"
          alt="Search icon"
          class="search-icon"
        />
        <input
          type="text"
          placeholder="Search logiforum"
          class="search-input"
        />
      </div>
    </header>
    <div class="main-content">
      <div class="side-bar">
        <aside class="side-bar" aria-label="Popular Superthreads">
          <h2 class="sidebar-heading">Popular Superthreads</h2>
          <ul class="superthread-list" id="superthread-list">
            <li>
              <button class="superthread-item active" data-superthread-id="101">
                <span class="superthread-title"
                  >Digital Logic &amp; Gate Design</span
                >
                <span class="superthread-meta">2 subthreads</span>
              </button>
            </li>
            <li>
              <button class="superthread-item" data-superthread-id="102">
                <span class="superthread-title"
                  >Sequential Circuits &amp; Flip-Flops</span
                >
                <span class="superthread-meta">0 subthreads</span>
              </button>
            </li>
          </ul>
        </aside>
      </div>
      <div class="posts-wrapper">
        <div class="posts-container" id="posts-container"></div>
        <div class="pagination">
          <button data-page="1">Page 1</button>
          <button data-page="2">Page 2</button>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
