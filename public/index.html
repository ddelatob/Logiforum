<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>logiforum</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="images/favicon.png" />
  </head>

  <body>
    <header class="top-row">
      <h1 class="digi-tools-header">logiforum</h1>
      <div class="search-bar">
        <img
          src="images/and_gate_vector.svg"
          alt="Search icon"
          class="search-icon"
        />
        <input
          type="text"
          placeholder="Search logiforum"
          class="search-input"
        />
      </div>
      <button type="button" id="new-post-btn" class="new-btn">+ New</button>
    </header>

    <div class="main-content">
      <div class="side-bar">
        <aside class="side-bar" aria-label="Popular Superthreads">
          <h2 class="sidebar-heading">Popular Superthreads</h2>
          <ul class="superthread-list" id="superthread-list"></ul>
        </aside>
      </div>
      <div class="posts-wrapper">
        <div id="feed-view">
          <div class="posts-container" id="posts-container"></div>
          <div class="pagination">
            <button data-page="1">Page 1</button>
            <button data-page="2">Page 2</button>
          </div>
        </div>
        <form id="create-view" class="create-view" hidden>
          <div class="create-header">
            <h2>Create post</h2>
            <button type="button" id="cancel-create-btn" class="ghost-btn">
              Cancel
            </button>
          </div>

          <div class="superthread-picker">
            <select id="superthread-select" required>
              <option value="" disabled selected>Select Superthread</option>

              <option value="__new__">+ Start a new superthread...</option>
            </select>
            <input
              type="text"
              id="new-superthread-input"
              placeholder="New superthread title"
              hidden
            />
          </div>

          <input
            type="text"
            id="post-title-input"
            placeholder="Title*"
            required
          />

          <input
            type="text"
            id="post-topic-input"
            placeholder="Topic / tag (optional)"
          />

          <textarea
            id="post-body-input"
            rows="6"
            placeholder="Body text (optional)"
          ></textarea>

          <div class="create-actions">
            <button type="submit" class="post-submit-btn">Post</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
