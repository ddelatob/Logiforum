<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 580" fill="none">
  <title>Digital logic AND gate with two inputs and one output</title>
  <defs>
    <filter id="blue-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.02
                0 0 0 0 0.28
                0 0 0 0 1
                0 0 0 1 0" result="blueBlur"/>
      <feMerge>
        <feMergeNode in="blueBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>


  <g stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"
     filter="url(#blue-glow)">
    <!-- Input wires -->
    <path d="M72 176 H176"/>
    <path d="M72 336 H176"/>

    <!-- AND gate body -->
    <path d="M176 112 V400 H272
             A144 144 0 0 0 272 112
             H176 Z"/>

    <!-- Output wire -->
    <path d="M416 256 H520"/>

    <!-- Input and output terminals -->
    <circle cx="64" cy="176" r="16" fill="#FFFFFF" stroke="none"/>
    <circle cx="64" cy="336" r="16" fill="#FFFFFF" stroke="none"/>
    <circle cx="520" cy="256" r="16" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>
